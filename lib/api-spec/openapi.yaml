                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/by-team:
    get:
      operationId: getDashboardByTeam
      tags: [dashboard]
      summary: Get dashboard metrics grouped by team
      responses:
        "200":
          description: Metrics by team
          content:
            application/json:
              schema:
