openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Controle de Diárias de Prestadores de Serviços
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication via DECARGO ID
  - name: users
    description: User management
  - name: teams
    description: Team management
  - name: providers
    description: Service provider management
  - name: diarias
    description: Daily rate records
  - name: audit
    description: Audit log
  - name: dashboard
    description: Dashboard summary
  - name: reports
    description: Reports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user session
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── USERS ─────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      operationId: createUser
      tags: [users]
      summary: Manually create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "200":
          description: >-
            An existing user was found with this email — it was updated in
            place (name/role/team/active) instead of creating a duplicate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/sync:
    post:
      operationId: syncUsers
      tags: [users]
      summary: Sync users (funcionários) from DECARGO People (admin only)
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncResult"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user role, team, name, email or status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Cannot delete — user has related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── TEAMS ─────────────────────────────────────────────────────────────
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"

    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── PROVIDERS ─────────────────────────────────────────────────────────
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List service providers
      parameters:
        - name: teamId
          in: query
          schema:
            type: ["integer", "null"]
        - name: activeOnly
          in: query
          description: When true, only active providers are returned. Defaults to false (all providers, including inactive).
          schema:
            type: boolean
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"

  /providers/sync:
    post:
      operationId: syncProviders
      tags: [providers]
      summary: Sync providers from DECARGO People (admin only)
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  # TEMP DEBUG: probe candidate "Contratos" endpoints to find where "objeto
  # do contrato" lives. Remove once confirmed.
  /providers/debug-contratos:
    get:
      operationId: debugContratos
      tags: [providers]
      summary: "TEMP DEBUG: probe candidate People Contratos endpoints (admin only)"
      responses:
        "200":
          description: Probe results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /providers/{id}:
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider's name, email, team or status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"

    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Cannot delete — provider has related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── DIÁRIAS ───────────────────────────────────────────────────────────
  /diarias:
    get:
      operationId: listDiarias
      tags: [diarias]
      summary: List daily rate records (filtered by role)
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum:
              - pendente_aprovacao
              - em_analise
              - aprovada
              - rejeitada
              - solicitacao_correcao
              - disponivel_exportacao
              - exportada
              - paga
              - cancelada
              - null
        - name: providerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: teamId
          in: query
          schema:
            type: ["integer", "null"]
        - name: managerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: startDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: endDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: pageSize
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Paginated daily rate records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiariasPage"

    post:
      operationId: createDiaria
      tags: [diarias]
      summary: Register a new daily rate (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaInput"
      responses:
        "201":
          description: Created daily rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/{id}:
    get:
      operationId: getDiaria
      tags: [diarias]
      summary: Get a daily rate by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daily rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateDiaria
      tags: [diarias]
      summary: Update a pending daily rate (manager only, while pending)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaUpdate"
      responses:
        "200":
          description: Updated daily rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

    delete:
      operationId: deleteDiaria
      tags: [diarias]
      summary: Cancel a daily rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/{id}/approve:
    post:
      operationId: approveDiaria
      tags: [diarias]
      summary: Approve a daily rate (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaActionNote"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/{id}/reject:
    post:
      operationId: rejectDiaria
      tags: [diarias]
      summary: Reject a daily rate (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaActionNote"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/{id}/request-correction:
    post:
      operationId: requestCorrectionDiaria
      tags: [diarias]
      summary: Request correction on a daily rate (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaActionNote"
      responses:
        "200":
          description: Correction requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/{id}/mark-paid:
    post:
      operationId: markDiariaPaid
      tags: [diarias]
      summary: Mark a daily rate as paid (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaActionNote"
      responses:
        "200":
          description: Marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/export:
    post:
      operationId: exportDiarias
      tags: [diarias]
      summary: Export approved daily rates to DECARGO People (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"

  # ── AUDIT ─────────────────────────────────────────────────────────────
  /audit:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries (admin only)
      parameters:
        - name: entityType
          in: query
          schema:
            type: ["string", "null"]
        - name: entityId
          in: query
          schema:
            type: ["integer", "null"]
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: startDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: endDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: pageSize
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"

  # ── DASHBOARD ─────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary counts and financial totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/by-team:
    get:
      operationId: getDashboardByTeam
      tags: [dashboard]
      summary: Get dashboard metrics grouped by team
      responses:
        "200":
          description: Metrics by team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMetrics"

  /dashboard/by-provider:
    get:
      operationId: getDashboardByProvider
      tags: [dashboard]
      summary: Get dashboard metrics grouped by provider
      responses:
        "200":
          description: Metrics by provider
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderMetrics"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent diárias activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── REPORTS ───────────────────────────────────────────────────────────
  /reports/diarias:
    get:
      operationId: getReportDiarias
      tags: [reports]
      summary: Detailed report of daily rates with filters
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: providerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: teamId
          in: query
          schema:
            type: ["integer", "null"]
        - name: managerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: startDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: endDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiariasReport"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    # ── AUTH / USER ──────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        decargoId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, gestor, prestador, funcionario]
        teamId:
          type: ["integer", "null"]
        teamName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, decargoId, name, email, role, active, createdAt]

    UserUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, gestor, prestador, funcionario]
        teamId:
          type: ["integer", "null"]
        active:
          type: boolean
        name:
          type: string
        email:
          type: string

    UserCreate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, gestor, prestador, funcionario]
        teamId:
          type: ["integer", "null"]
        active:
          type: boolean
      required: [name, email, role]

    # ── TEAMS ────────────────────────────────────────────────────────────
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        providerCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, providerCount, createdAt]

    TeamInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        managerId:
          type: ["integer", "null"]
      required: [name]

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        managerId:
          type: ["integer", "null"]

    # ── PROVIDERS ────────────────────────────────────────────────────────
    Provider:
      type: object
      properties:
        id:
          type: integer
        decargoId:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        teamId:
          type: ["integer", "null"]
        teamName:
          type: ["string", "null"]
        active:
          type: boolean
        syncedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, decargoId, name, active]

    ProviderUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: ["string", "null"]
        teamId:
          type: ["integer", "null"]
        active:
          type: boolean

    SyncResult:
      type: object
      description: >-
        Sync is additive-only: it creates providers that don't exist locally
        yet (matched by decargoId) and never touches existing rows, so a
        manual deactivation (or any other admin edit) in the app is never
        overwritten by a later sync.
      properties:
        synced:
          type: integer
        created:
          type: integer
        skipped:
          type: integer
      required: [synced, created, skipped]

    UserSyncResult:
      type: object
      description: >-
        Sync is additive-only: it creates users that don't exist locally yet
        (matched by decargoId or email) and never touches existing rows, so a
        manual deactivation (or any other admin edit) in the app is never
        overwritten by a later sync.
      properties:
        synced:
          type: integer
        created:
          type: integer
        skipped:
          type: integer
      required: [synced, created, skipped]

    # ── DIÁRIAS ──────────────────────────────────────────────────────────
    Diaria:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: integer
        providerName:
          type: string
        teamId:
          type: integer
        teamName:
          type: string
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        workDate:
          type: string
          format: date
        value:
          type: ["number", "null"]
          description: Null when viewer is a provider (no financial visibility)
        paymentDate:
          type: ["string", "null"]
          format: date
        observations:
          type: ["string", "null"]
        status:
          type: string
          enum:
            - pendente_aprovacao
            - em_analise
            - aprovada
            - rejeitada
            - solicitacao_correcao
            - disponivel_exportacao
            - exportada
            - paga
            - cancelada
        actionNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
        approvedAt:
          type: ["string", "null"]
          format: date-time
        approvedByName:
          type: ["string", "null"]
        exportedAt:
          type: ["string", "null"]
          format: date-time
        exportedByName:
          type: ["string", "null"]
        integrationId:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
          format: date-time
        cancelledAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - providerId
        - providerName
        - teamId
        - teamName
        - workDate
        - status
        - createdAt
        - createdByName

    DiariaInput:
      type: object
      properties:
        providerId:
          type: integer
        teamId:
          type: integer
        workDate:
          type: string
          format: date
        value:
          type: number
        paymentDate:
          type: ["string", "null"]
          format: date
