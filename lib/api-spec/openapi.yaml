                  $ref: "#/components/schemas/ActivityItem"

  # ── REPORTS ───────────────────────────────────────────────────────────
  /reports/diarias:
    get:
      operationId: getReportDiarias
      tags: [reports]
      summary: Detailed report of daily rates with filters
      parameters:
        - name: status
