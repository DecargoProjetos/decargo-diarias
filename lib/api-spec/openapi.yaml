                  $ref: "#/components/schemas/ProviderMetrics"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent diárias activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
