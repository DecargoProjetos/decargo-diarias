        - $ref: "#/components/parameters/Id"
        - name: status
          in: path
          required: true
          schema: { type: string, enum: [open, close, reopen] }
      responses:
        "200":
          description: Updated period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetencePeriod" }
  /competence-periods/{id}/releases:
    get:
      operationId: listCompetencePeriodReleases
      tags: [competence-periods]
      summary: List releases for a period with manager names (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompetenceRelease" }
    post:
      operationId: createCompetencePeriodRelease
      tags: [competence-periods]
      summary: Grant exceptional manager release (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompetenceReleaseInput" }
      responses:
        "201":
          description: Created release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetenceRelease" }
  /competence-periods/{id}/releases/{releaseId}:
    delete:
      operationId: cancelCompetencePeriodRelease
      tags: [competence-periods]
      summary: Cancel exceptional manager release (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: releaseId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }

  # ── AUDIT ─────────────────────────────────────────────────────────────
  /audit:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries (admin only)
      parameters:
        - name: action
