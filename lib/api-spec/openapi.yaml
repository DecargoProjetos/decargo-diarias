openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Controle de Diárias de Prestadores de Serviços
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication via DECARGO ID
  - name: users
    description: User management
  - name: teams
    description: Team management
  - name: providers
    description: Service provider management
  - name: diarias
    description: Daily rate records
  - name: audit
    description: Audit log
  - name: dashboard
    description: Dashboard summary
  - name: reports
    description: Reports
  - name: competence-periods
    description: Registration deadline administration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /healthz/retention:
    get:
      operationId: userSyncRetentionHealth
      tags: [health]
      summary: Per-process report cleanup alert status (not a liveness check)
      description: Returns 503 after three consecutive hourly failures until a successful cleanup. Contains no report data or database error details.
      responses:
        "200":
          description: No active cleanup alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncRetentionHealth"
        "503":
          description: Repeated cleanup failure alert is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncRetentionHealth"

  # ── AUTH ──────────────────────────────────────────────────────────────
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user session
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── USERS ─────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      operationId: createUser
      tags: [users]
      summary: Manually create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Person already registered by email or normalized full name, including inactive records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/sync:
    post:
      operationId: syncUsers
      tags: [users]
      summary: Sync users (funcionários) from DECARGO People (admin only)
      description: Importação aditiva e auditoria agregada são confirmadas na mesma transação. Contas existentes não são alteradas; evidências pessoais de conflitos não são gravadas na auditoria.
      responses:
        "200":
          description: Importação e auditoria confirmadas; relatório desta execução
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncResult"
        "500":
          description: Importação ou auditoria não confirmada; nenhum usuário importado nesta tentativa (USER_SYNC_NOT_COMMITTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Falha ao consultar DECARGO People antes da importação (PEOPLE_FETCH_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/sync-reports:
    get:
      operationId: listUserSyncReports
      tags: [users]
      summary: Execuções salvas vigentes, da mais recente à mais antiga (somente admin)
      description: Lista somente datas e contadores, sem consultar o People nem expor evidências de outras execuções.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Página de execuções não expiradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncReportPage"
        "400":
          description: Paginação inválida
        "401":
          description: Não autenticado
        "403":
          description: Administrador obrigatório
        "503":
          description: Consulta ao histórico indisponível

  /users/sync-reports/{reportId}:
    get:
      operationId: getUserSyncReport
      tags: [users]
      summary: Snapshot de uma execução salva (somente admin, sem chamada ao People)
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      responses:
        "200":
          description: Execução vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncReport"
        "400":
          description: Identificador inválido
        "401":
          description: Não autenticado
        "403":
          description: Administrador obrigatório
        "404":
          description: Execução inexistente ou expirada
        "503":
          description: Consulta ao histórico indisponível

  /users/sync-reports/latest:
    get:
      operationId: getLatestUserSyncReport
      tags: [users]
      summary: Último relatório salvo de funcionários (somente admin, sem chamada ao People)
      description: Execuções concluídas são retidas por 30 dias. Retorna null se não houver relatório vigente.
      responses:
        "200":
          description: Última execução concluída ou ausência de relatório
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSyncReportLookup"
        "401":
          description: Não autenticado
        "403":
          description: Administrador obrigatório
        "503":
          description: Consulta ao histórico indisponível

  /users/{id}/enable-diarias:
    post:
      operationId: enableUserDiarias
      tags: [users]
      summary: Habilitar diárias localmente sem alterar o cadastro ou permissões (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDiariasEnablement"
      responses:
        "201":
          description: Vínculo local criado; exportação permanece bloqueada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDiariasEnablementResult"
        "400":
          description: Confirmação ou valor inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Login obrigatório
        "403":
          description: Apenas administradores
        "404":
          description: Usuário não encontrado
        "409":
          description: Já habilitado ou vínculo de identidade não confirmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Atomically update a person and their linked provider (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale edit or ambiguous person identity; no changes saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Cannot delete — user has related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── TEAMS ─────────────────────────────────────────────────────────────
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"

    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a team by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── PROVIDERS ─────────────────────────────────────────────────────────
  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List service providers
      parameters:
        - name: teamId
          in: query
          schema:
            type: ["integer", "null"]
        - name: activeOnly
          in: query
          description: When true, only active providers are returned. Defaults to false (all providers, including inactive).
          schema:
            type: boolean
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"

  /providers/sync:
    post:
      operationId: syncProviders
      tags: [providers]
      summary: Sync providers from DECARGO People (admin only)
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /providers/reconciliation:
    get:
      operationId: listProviderReconciliation
      tags: [providers]
      summary: Review fresh People provider identities (admin only)
      responses:
        "200":
          description: Pending or conflicting People identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderReconciliationCandidate"
    post:
      operationId: resolveProviderReconciliation
      tags: [providers]
      summary: Explicitly reconcile or import a distinct People provider (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderReconciliationInput"
      responses:
        "200":
          description: Resolution completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Ambiguous, stale or conflicting identity; no changes made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /providers/{id}:
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get a provider by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateProvider
      tags: [providers]
      summary: Update a provider's name, email, team or status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          description: Invalid confirmed provider email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only administrators may update providers or confirm an email association
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already associated with another provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteProvider
      tags: [providers]
      summary: Delete a provider (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "409":
          description: Cannot delete — provider has related records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── DIÁRIAS ───────────────────────────────────────────────────────────
  /diarias:
    get:
      operationId: listDiarias
      tags: [diarias]
      summary: List daily rate records (filtered by role)
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum:
              - pendente_aprovacao
              - em_analise
              - aprovada
              - rejeitada
              - solicitacao_correcao
              - disponivel_exportacao
              - exportada
              - paga
              - cancelada
              - null
        - name: providerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: teamId
          in: query
          schema:
            type: ["integer", "null"]
        - name: managerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: startDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: endDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: name
          in: query
          description: Filtra por nome do prestador (busca parcial, case-insensitive)
          schema:
            type: ["string", "null"]
        - name: minValue
          in: query
          schema:
            type: ["number", "null"]
        - name: maxValue
          in: query
          schema:
            type: ["number", "null"]
        - name: value
          in: query
          description: Valor exato da diária
          schema:
            type: ["number", "null"]
        - name: hasPaymentDate
          in: query
          description: Filtra diárias com ou sem data de pagamento
          schema:
            type: ["string", "null"]
            enum: [sim, nao, null]
        - name: sortBy
          in: query
          description: Agrupa por nome do prestador em ordem alfabética e ordena suas datas trabalhadas da mais antiga para a mais recente
          schema:
            type: ["string", "null"]
            enum: [providerName, null]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: pageSize
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Paginated daily rate records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiariasPage"

    post:
      operationId: createDiaria
      tags: [diarias]
      summary: Register a new daily rate (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaInput"
      responses:
        "201":
          description: Created daily rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/summary:
    get:
      operationId: getDiariasAnaliseSummary
      tags: [diarias]
      summary: Dashboard indicators for the Análise de Diárias screen (admin only)
      parameters:
        - name: name
          in: query
          schema:
            type: ["string", "null"]
        - name: teamId
          in: query
          schema:
            type: ["integer", "null"]
        - name: startDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: endDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: minValue
          in: query
          schema:
            type: ["number", "null"]
        - name: maxValue
          in: query
          schema:
            type: ["number", "null"]
        - name: value
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Summary indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiariasAnaliseSummary"

  /diarias/ids:
    get:
      operationId: listDiariaIds
      tags: [diarias]
      summary: List all daily rate IDs matching the current filters, unpaginated (admin only, used for "select all filtered")
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: name
          in: query
          schema:
            type: ["string", "null"]
        - name: providerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: teamId
          in: query
          schema:
            type: ["integer", "null"]
        - name: managerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: startDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: endDate
          in: query
          schema:
            type: ["string", "null"]
            format: date
        - name: minValue
          in: query
          schema:
            type: ["number", "null"]
        - name: maxValue
          in: query
          schema:
            type: ["number", "null"]
        - name: value
          in: query
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Matching IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiariaIdsResult"

  /diarias/bulk-approve:
    post:
      operationId: bulkApproveDiarias
      tags: [diarias]
      summary: Approve multiple daily rates at once (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIdsInput"
      responses:
        "200":
          description: Bulk approval result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /diarias/bulk-reject:
    post:
      operationId: bulkRejectDiarias
      tags: [diarias]
      summary: Reject multiple daily rates at once (admin only). A rejection reason is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkRejectInput"
      responses:
        "200":
          description: Bulk rejection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /diarias/bulk-set-payment-date:
    post:
      operationId: bulkSetDiariaPaymentDate
      tags: [diarias]
      summary: Apply a payment date to multiple daily rates at once (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSetPaymentDateInput"
      responses:
        "200":
          description: Bulk payment-date update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"

  /diarias/{id}/payment-date:
    patch:
      operationId: setDiariaPaymentDate
      tags: [diarias]
      summary: Set/update the payment date of a daily rate (admin only, blocked after export)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDateInput"
      responses:
        "200":
          description: Updated daily rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"
        "400":
          description: Blocked (already exported/paid, or invalid state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /diarias/{id}:
    get:
      operationId: getDiaria
      tags: [diarias]
      summary: Get a daily rate by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daily rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateDiaria
      tags: [diarias]
      summary: Update a pending daily rate (manager only, while pending)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaUpdate"
      responses:
        "200":
          description: Updated daily rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

    delete:
      operationId: deleteDiaria
      tags: [diarias]
      summary: Permanently delete a daily rate (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Permanently deleted. Exported and paid records are protected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiariaDeletionResult"
        "400":
          description: Exported or paid daily rates cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Daily rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /diarias/{id}/revert:
    post:
      operationId: revertDiaria
      tags: [diarias]
      summary: Revert an eligible daily rate to pending review (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reverted daily rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"
        "400":
          description: Daily rate cannot be reverted from its current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Daily rate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /diarias/{id}/approve:
    post:
      operationId: approveDiaria
      tags: [diarias]
      summary: Approve a daily rate (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaActionNote"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/{id}/reject:
    post:
      operationId: rejectDiaria
      tags: [diarias]
      summary: Reject a daily rate (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaActionNote"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/{id}/request-correction:
    post:
      operationId: requestCorrectionDiaria
      tags: [diarias]
      summary: Request correction on a daily rate (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaActionNote"
      responses:
        "200":
          description: Correction requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/{id}/mark-paid:
    post:
      operationId: markDiariaPaid
      tags: [diarias]
      summary: Mark a daily rate as paid (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiariaActionNote"
      responses:
        "200":
          description: Marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diaria"

  /diarias/export/correction/preview:
    post:
      operationId: previewExportCorrection
      tags: [diarias]
      summary: Review selected records and integrated payees for a payment correction (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportCorrectionSelection" }
      responses:
        "200":
          description: Eligible records, integrated active providers and extra-payment types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportCorrectionPreview" }
        "400": { description: Invalid selection }
        "401": { description: Authentication required }
        "403": { description: Administrator required }
  /diarias/export/correction:
    post:
      operationId: resolveExportCorrection
      tags: [diarias]
      summary: Audited payee or extra-payment type correction, returning changed rows to approval (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportCorrectionConfirmation" }
      responses:
        "200":
          description: Correction committed atomically, without an external export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportCorrectionResult" }
        "400": { description: Invalid or unchanged correction }
        "401": { description: Authentication required }
        "403": { description: Administrator required }
        "409": { description: "Changed selection, protected record, unavailable identity or CNPJ mismatch" }
        "503": { description: Correction result could not be confirmed }

  /diarias/export/recovery/preview:
    post:
      operationId: previewExportRecovery
      tags: [diarias]
      summary: Review failed export reservations without changing records (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRecoverySelection" }
      responses:
        "200":
          description: Reservations eligible for explicit external reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportRecoveryPreview" }
        "400": { description: Invalid selection }
        "401": { description: Authentication required }
        "403": { description: Administrator required }

  /diarias/export/recovery:
    post:
      operationId: resolveExportRecovery
      tags: [diarias]
      summary: Release failed reservations after confirmed non-export in People (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRecoveryConfirmation" }
      responses:
        "200":
          description: Reservations released and audited atomically; no external export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportRecoveryResult" }
        "400": { description: External confirmation and reason required }
        "401": { description: Authentication required }
        "403": { description: Administrator required }
        "409": { description: Reservation changed or export not known to have failed }
        "503": { description: Recovery result could not be confirmed }

  /diarias/export/review:
    post:
      operationId: reviewPeopleExportBatch
      tags: [diarias]
      summary: Review selected records against People destinations (admin only)
      description: Read-only review of all selected IDs, including other pages. Derives destinations from local types. Does not query People persons, write financial data or touch reservations. Export POST rechecks independently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeopleExportReviewInput" }
      responses:
        "200":
          description: Complete batch compatibility review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleExportReview" }
        "400": { description: Invalid selection }
        "401": { description: Authentication required }
        "403": { description: Administrator required }
        "503":
          description: Review unavailable, not an indication of unsupported destinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /diarias/export/capabilities:
    get:
      operationId: getPeopleExportCapabilities
      tags: [diarias]
      summary: Read People v2 financial destinations (authenticated admin only)
      description: Read-only indication. Does not query people, reserve records or release existing reservations. Export POST always rechecks availability.
      responses:
        "200":
          description: Supported destinations; an empty list means no financial destination is supported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleExportCapabilities" }
        "401": { description: Authentication required }
        "403": { description: Administrator required }
        "503":
          description: Access, timeout or invalid upstream contract; not an unsupported destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /diarias/export/attempts:
    get:
      operationId: listExportAttempts
      tags: [diarias]
      summary: Recent persistent export attempts (admin only)
      responses:
        "200":
          description: Latest 20 attempts, including running attempts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExportAttempt" }
  /diarias/export/attempts/{integrationRef}:
    get:
      operationId: getExportAttempt
      tags: [diarias]
      summary: Consult an export without resending financial records (admin only)
      parameters:
        - in: path
          name: integrationRef
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Persistent progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportAttempt" }
        "404":
          description: Attempt not found
  /diarias/export:
    post:
      operationId: exportDiarias
      tags: [diarias]
      summary: Export approved daily rates to DECARGO People (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"

  # ── COMPETENCE REGISTRATION PERIODS ───────────────────────────────────
  /competence-periods:
    get:
      operationId: listCompetencePeriods
      tags: [competence-periods]
      summary: List competence registration periods (admin only)
      responses:
        "200":
          description: Periods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CompetencePeriod" }
    post:
      operationId: createCompetencePeriod
      tags: [competence-periods]
      summary: Create a competence registration period (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompetencePeriodInput" }
      responses:
        "201":
          description: Created period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetencePeriod" }
  /competence-periods/status/work-date/{workDate}:
    get:
      operationId: getCompetenceWorkDateStatus
      tags: [competence-periods]
      summary: Get authenticated user's registration authorization for a work date
      parameters:
        - name: workDate
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Authorization status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetenceAuthorization" }
  /competence-periods/{id}:
    patch:
      operationId: updateCompetencePeriod
      tags: [competence-periods]
      summary: Update a competence registration period (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompetencePeriodInput" }
      responses:
        "200":
          description: Updated period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetencePeriod" }
    delete:
      operationId: deleteCompetencePeriod
      tags: [competence-periods]
      summary: Delete a competence registration period (admin only)
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
  /competence-periods/{id}/{status}:
    post:
      operationId: setCompetencePeriodStatus
      tags: [competence-periods]
      summary: Close, open, or reopen a competence period (admin only)
