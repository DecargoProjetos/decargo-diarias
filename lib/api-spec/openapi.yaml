            application/json:
              schema:
                $ref: "#/components/schemas/DiariasReport"

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    ExportCorrectionSelection:
      type: object
      required: [diariaIds]
      properties:
        diariaIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 2147483647 }
    ExportCorrectionRow:
      type: object
      required: [id, providerId, providerName, providerDecargoId, cnpj, typeId, typeName, exportTarget, status, integrationId, exportedAt, exportedBy, workDate, paymentDate, value, updatedAt, approvedAt, approvedBy]
      properties:
        id: { type: integer }
        providerId: { type: integer }
        providerName: { type: string }
        providerDecargoId: { type: string }
        cnpj: { type: [string, "null"] }
        typeId: { type: [integer, "null"] }
        typeName: { type: [string, "null"] }
        exportTarget: { type: [string, "null"] }
        status: { type: string }
        integrationId: { type: [string, "null"] }
        exportedAt: { type: [string, "null"] }
        exportedBy: { type: [integer, "null"] }
        workDate: { type: string }
        paymentDate: { type: [string, "null"] }
        value: { type: string }
        updatedAt: { type: string }
        approvedAt: { type: [string, "null"] }
        approvedBy: { type: [integer, "null"] }
    ExportCorrectionProvider:
      type: object
      required: [id, name, decargoId, cnpj]
      properties:
        id: { type: integer }
        name: { type: string }
        decargoId: { type: string }
        cnpj: { type: [string, "null"] }
    ExportCorrectionType:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    ExportCorrectionPreview:
      type: object
      required: [rows, skipped, providers, types]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/ExportCorrectionRow" }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/ExportRecoverySkipped" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ExportCorrectionProvider" }
        types:
          type: array
          items: { $ref: "#/components/schemas/ExportCorrectionType" }
    ExportCorrectionItem:
      type: object
      required: [id, expectedProviderId, expectedTypeId, expectedUpdatedAt, expectedProviderDecargoId, expectedPeopleId, providerId, typeId]
      properties:
        id: { type: integer, minimum: 1, maximum: 2147483647 }
        expectedProviderId: { type: integer, minimum: 1, maximum: 2147483647 }
        expectedTypeId: { type: [integer, "null"] }
        expectedUpdatedAt: { type: string, minLength: 1, maxLength: 100 }
        expectedProviderDecargoId: { type: string, maxLength: 200 }
        expectedPeopleId: { type: string, pattern: "^[1-9][0-9]*$" }
        providerId: { type: integer, minimum: 1, maximum: 2147483647 }
        typeId: { type: integer, minimum: 1, maximum: 2147483647 }
        verifiedCnpj: { type: string, minLength: 14, maxLength: 18 }
    ExportCorrectionConfirmation:
      type: object
      required: [corrections, confirmed, reason]
      properties:
        corrections:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/ExportCorrectionItem" }
        confirmed: { type: boolean, enum: [true] }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    ExportCorrectionResult:
      type: object
      required: [correctedIds, unchangedIds]
      properties:
        correctedIds:
          type: array
          items: { type: integer }
        unchangedIds:
          type: array
          items: { type: integer }
    ExportRecoverySelection:
      type: object
      required: [diariaIds]
      properties:
        diariaIds:
          type: array
          minItems: 1
          maxItems: 2000
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    ExportRecoveryReservation:
      type: object
      required: [id, integrationId]
      properties:
        id: { type: integer, minimum: 1 }
        integrationId: { type: string, minLength: 1, maxLength: 100 }
    ExportRecoverySkipped:
      type: object
      required: [id, reason]
      properties:
        id: { type: integer }
        reason: { type: string }
    ExportRecoveryPreview:
      type: object
      required: [eligible, skipped]
      properties:
        eligible:
          type: array
          items: { $ref: "#/components/schemas/ExportRecoveryReservation" }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/ExportRecoverySkipped" }
    ExportRecoveryConfirmation:
      type: object
      required: [reservations, confirmedNotExported, reason]
      properties:
        reservations:
          type: array
          minItems: 1
          maxItems: 2000
          items: { $ref: "#/components/schemas/ExportRecoveryReservation" }
        confirmedNotExported: { type: boolean, enum: [true] }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    ExportRecoveryResult:
      type: object
      required: [released, releasedIds]
      properties:
        released: { type: integer, minimum: 0 }
        releasedIds:
          type: array
          items: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    UserSyncRetentionHealth:
      type: object
      required: [status, alertActive, consecutiveFailures, threshold, firstFailureAt, lastSuccessAt]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        alertActive:
          type: boolean
        consecutiveFailures:
          type: integer
          minimum: 0
        threshold:
          type: integer
          enum: [3]
        firstFailureAt:
          type: string
          nullable: true
        lastSuccessAt:
          type: string
          nullable: true

    PeopleExportReviewInput:
      type: object
      required: [diariaIds]
      properties:
        diariaIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 2147483647 }

    PeopleExportReview:
      type: object
      required: [supportedTargets, reviewedCount, incompatibleRecords, missingIds]
      properties:
        supportedTargets:
          type: array
          items: { type: string, enum: [diarias, descontos] }
        reviewedCount: { type: integer }
        missingIds:
          type: array
          items: { type: integer }
        incompatibleRecords:
          type: array
          items: { $ref: "#/components/schemas/PeopleExportIncompatibleRecord" }

    PeopleExportIncompatibleRecord:
      type: object
      required: [id, providerName, workDate, typeName, requiredTarget, reason]
      properties:
        id: { type: integer }
        providerName: { type: string }
        workDate: { type: string }
        typeName: { type: string, nullable: true }
        requiredTarget: { type: string, nullable: true, enum: [diarias, descontos, null] }
        reason: { type: string, enum: [unsupported_target, unconfigured_type] }

    PeopleExportCapabilities:
      type: object
      required: [supportedTargets]
      properties:
        supportedTargets:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [diarias, descontos]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    CompetencePeriod:
      type: object
      required: [id, name, workStartDate, workEndDate, deadlineAt, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        workStartDate: { type: string, format: date }
        workEndDate: { type: string, format: date }
        deadlineAt: { type: string, format: date-time, description: "Instant shown in America/Sao_Paulo" }
        observations: { type: ["string", "null"] }
        status: { type: string, enum: [open, closed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: ["integer", "null"] }

    CompetencePeriodInput:
      type: object
      required: [name, workStartDate, workEndDate, deadlineAt]
      properties:
        name: { type: string, minLength: 1 }
        workStartDate: { type: string, format: date }
        workEndDate: { type: string, format: date }
        deadlineAt: { type: string, format: date-time }
        observations: { type: string }

    CompetenceRelease:
      type: object
      required: [id, periodId, managerId, startsAt, expiresAt, active, createdAt]
      properties:
        id: { type: integer }
        periodId: { type: integer }
        managerId: { type: integer }
        managerName: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        active: { type: boolean }
        reason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        createdBy: { type: ["integer", "null"] }
        cancelledAt: { type: ["string", "null"], format: date-time }
        cancelledBy: { type: ["integer", "null"] }

    CompetenceReleaseInput:
      type: object
      required: [managerId, startsAt, expiresAt]
      properties:
        managerId: { type: integer }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        reason: { type: string }

    CompetenceAuthorization:
      type: object
      required: [allowed, source]
      properties:
        allowed: { type: boolean }
        source: { type: string, enum: [admin, no_period, period, release, closed, expired] }
        periodId: { type: integer }
        releaseId: { type: integer }
        message: { type: string }
        period:
          $ref: "#/components/schemas/CompetencePeriod"

    DiariaDeletionResult:
      type: object
      properties:
        id:
          type: integer
        deleted:
          type: boolean
      required: [id, deleted]

    # ── AUTH / USER ──────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: integer
        decargoId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, gestor, prestador, funcionario]
        teamId:
          type: ["integer", "null"]
        teamName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, decargoId, name, email, role, active, createdAt]

    UserDiariasEnablement:
      type: object
      properties:
        confirmed:
          type: boolean
          enum: [true]
        dailyRate:
          type: number
          minimum: 0
          maximum: 99999999.99
      required: [confirmed, dailyRate]

    UserDiariasEnablementResult:
      type: object
      properties:
        providerId:
          type: integer
        dailyRate:
          type: number
        localOnly:
          type: boolean
          enum: [true]
      required: [providerId, dailyRate, localOnly]

    UserUpdate:
      type: object
      properties:
        expectedUpdatedAt:
          description: Access record version captured when editing began
          type: string
          format: date-time
        expectedProviderUpdatedAt:
          description: Linked financial record version captured when editing began
          type: ["string", "null"]
          format: date-time
        expectedProviderId:
          description: Expected link (null if not enabled); never used to choose an identity
          type: ["integer", "null"]
          minimum: 1
        dailyRate:
          type: ["number", "null"]
          minimum: 0
          maximum: 99999999.99
        role:
          type: string
          enum: [admin, gestor, prestador, funcionario]
        teamId:
          type: ["integer", "null"]
        active:
          type: boolean
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 254

    UserCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          maxLength: 254
        role:
          type: string
          enum: [admin, gestor, prestador, funcionario]
        teamId:
          type: ["integer", "null"]
          minimum: 1
        active:
          type: boolean
        dailyRate:
          type: ["number", "null"]
          minimum: 0
          maximum: 99999999.99
      required: [name, email, role]

    # ── TEAMS ────────────────────────────────────────────────────────────
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        providerCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, providerCount, createdAt]

    TeamInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        managerId:
          type: ["integer", "null"]
      required: [name]

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        managerId:
          type: ["integer", "null"]

    # ── PROVIDERS ────────────────────────────────────────────────────────
    Provider:
      type: object
      properties:
        id:
          type: integer
        decargoId:
          type: string
        localReference:
          type: ["string", "null"]
          description: Stable local identity retained after administrator reconciliation
        cnpj:
          type: ["string", "null"]
        name:
          type: string
        email:
          type: ["string", "null"]
        teamId:
          type: ["integer", "null"]
        teamName:
          type: ["string", "null"]
        dailyRate:
          type: ["number", "null"]
          description: Valor padrão da diária deste prestador
        active:
          type: boolean
        syncedAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, decargoId, name, active]

    ProviderReconciliationCandidate:
      type: object
      required: [externalId, name, cnpj, existingProviderId, conflict]
      properties:
        externalId:
          type: string
        name:
          type: string
        cnpj:
          type: ["string", "null"]
        existingProviderId:
          type: ["integer", "null"]
        conflict:
          type: ["string", "null"]

    ProviderReconciliationInput:
      type: object
      required: [externalId, action, confirmed, evidence]
      properties:
        externalId:
          type: string
          pattern: '^[1-9][0-9]*$'
        action:
          type: string
          enum: [link, separate]
        localProviderId:
          type: integer
          minimum: 1
        verifiedCnpj:
          type: string
        evidence:
          type: string
          minLength: 10
          maxLength: 500
          description: Description of independently checked contract/document, without credentials
        confirmed:
          type: boolean

    ProviderUpdate:
      type: object
      properties:
        expectedUpdatedAt:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: ["string", "null"]
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        cnpj:
          type: ["string", "null"]
        teamId:
          type: ["integer", "null"]
          minimum: 1
        dailyRate:
          type: ["number", "null"]
          minimum: 0
          maximum: 99999999.99
        active:
          type: boolean

    SyncResult:
      type: object
      description: >-
        Sync is additive-only: it creates providers that don't exist locally
        yet (matched by decargoId) and never touches existing rows, so a
        manual deactivation (or any other admin edit) in the app is never
        overwritten by a later sync.
      properties:
        synced:
          type: integer
        created:
          type: integer
        skipped:
          type: integer
        pending:
          type: integer
          description: Records withheld for explicit administrator identity review
      required: [synced, created, skipped]

    UserSyncResult:
      type: object
      description: >-
        Sync is additive-only: it creates users that don't exist locally yet
        (matched by decargoId or email) and never touches existing rows, so a
        manual deactivation (or any other admin edit) in the app is never
        overwritten by a later sync.
      properties:
        synced:
          type: integer
        created:
          type: integer
        skipped:
          type: integer
        conflicts:
          type: integer
        conflictDetails:
          type: array
          description: Admin-only, read-only report for this sync; one entry per ignored source record.
          items:
            $ref: "#/components/schemas/UserSyncConflict"
      required: [synced, created, skipped, conflicts, conflictDetails]

    UserSyncReportSummary:
      type: object
      required: [id, completedAt, expiresAt, synced, created, skipped, conflicts]
      properties:
        id:
          type: string
        completedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        synced:
          type: integer
        created:
          type: integer
        skipped:
          type: integer
        conflicts:
          type: integer

    UserSyncReportPage:
      type: object
      required: [reports, page, pageSize, hasMore, retentionDays]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/UserSyncReportSummary"
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean
        retentionDays:
          type: integer
          enum: [30]

    UserSyncReportLookup:
      type: object
      required: [report, retentionDays]
      properties:
        retentionDays:
          type: integer
          enum: [30]
        report:
          oneOf:
            - $ref: "#/components/schemas/UserSyncReport"
            - type: "null"

    UserSyncReport:
      type: object
      description: Snapshot administrativo, sem dados de pessoas importadas sem conflito, tokens ou payload bruto do People.
      required: [id, completedAt, expiresAt, result]
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        completedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        result:
          $ref: "#/components/schemas/UserSyncResult"

    UserSyncEmployee:
      type: object
      required: [employeeId, name, email, active]
      properties:
        employeeId:
          type: string
          description: People employee ID (id_funcionario), not a login account or local user ID.
        name:
          type: string
        email:
          type: ["string", "null"]
          description: Trimmed, lowercase email, or null when absent.
        active:
          type: boolean

    UserSyncLocalAccount:
      type: object
      required: [localUserId, externalReference, name, email, active]
      properties:
        localUserId:
          type: integer
          description: Local Diárias user ID, suitable for locating the existing record.
        externalReference:
          type: string
          description: Stored decargoId; its origin may be legacy employee, login account or manual. Not proof of identity.
        name:
          type: string
        email:
          type: string
        active:
          type: boolean

    UserSyncConflict:
      type: object
      required: [employee, reasons, localAccounts, sourceEmployees]
      properties:
        employee:
          $ref: "#/components/schemas/UserSyncEmployee"
        reasons:
          type: array
          minItems: 1
          items:
            type: string
            enum: [employee_id_account_collision, ambiguous_local_email, duplicate_source, invalid_employee_id]
        localAccounts:
          type: array
          items:
            $ref: "#/components/schemas/UserSyncLocalAccount"
        sourceEmployees:
          type: array
          description: All source records sharing this employee ID or normalized email, including the ignored record.
          items:
            $ref: "#/components/schemas/UserSyncEmployee"

    # ── DIÁRIAS ──────────────────────────────────────────────────────────
    Diaria:
      type: object
      properties:
        id:
          type: integer
        providerId:
          type: integer
        providerName:
          type: string
        teamId:
          type: integer
        teamName:
          type: string
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        workDate:
          type: string
          format: date
        startTime:
          type: ["string", "null"]
          description: Horário inicial no formato HH:mm
        endTime:
          type: ["string", "null"]
          description: Horário final no formato HH:mm
        value:
          type: ["number", "null"]
          description: Null when viewer is a provider (no financial visibility)
        paymentDate:
          type: ["string", "null"]
          format: date
        observations:
          type: ["string", "null"]
        status:
          type: string
          enum:
            - pendente_aprovacao
            - em_analise
            - aprovada
            - rejeitada
            - solicitacao_correcao
            - disponivel_exportacao
            - exportada
            - paga
            - cancelada
        actionNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        createdByName:
          type: string
        approvedAt:
          type: ["string", "null"]
          format: date-time
        approvedByName:
          type: ["string", "null"]
        exportedAt:
          type: ["string", "null"]
          format: date-time
        exportedByName:
          type: ["string", "null"]
        integrationId:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
          format: date-time
        cancelledAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - providerId
        - providerName
        - teamId
        - teamName
        - workDate
        - status
        - createdAt
        - createdByName

    DiariaInput:
      type: object
      properties:
        providerId:
          type: integer
        teamId:
          type: integer
        workDate:
          type: string
          format: date
        startTime:
          type: ["string", "null"]
          description: Horário inicial no formato HH:mm
        endTime:
          type: ["string", "null"]
          description: Horário final no formato HH:mm
        value:
          type: number
        paymentDate:
          type: ["string", "null"]
          format: date
        observations:
          type: ["string", "null"]
      required: [providerId, teamId, workDate, value]

    DiariaUpdate:
      type: object
      properties:
        workDate:
          type: string
          format: date
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        value:
          type: number
        paymentDate:
          type: ["string", "null"]
          format: date
        observations:
          type: ["string", "null"]

    DiariaActionNote:
      type: object
      properties:
        note:
          type: ["string", "null"]

    ExportInput:
      type: object
      properties:
        diariaIds:
          type: array
          items:
            type: integer
        paymentDate:
          type: string
          format: date
          description: Data de pagamento usada como alternativa para diárias extras sem data definida.
      required: [diariaIds]

    ExportAttempt:
      type: object
      required: [integrationRef, status, createdAt, updatedAt, total, confirmed, rejected, uncertain, unsent, skipped, message]
      properties:
        integrationRef: { type: string }
        status:
          type: string
          enum: [running, completed, interrupted]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        total: { type: integer }
        confirmed:
          type: array
          items: { type: integer }
        rejected:
          type: array
          items: { type: integer }
        uncertain:
          description: In-flight or unconfirmed records; never automatically resent
          type: array
          items: { type: integer }
        unsent:
          type: array
          items: { type: integer }
        skipped:
          type: array
          items: { $ref: "#/components/schemas/ExportSkippedItem" }
        message: { type: ["string", "null"] }
    ExportSkippedItem:
      type: object
      required: [id, reason]
      properties:
        id: { type: integer }
        reason: { type: string }
    ExportResult:
      type: object
      properties:
        exported:
          type: integer
        integrationRef:
          type: string
        exportedAt:
          type: string
          format: date-time
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/BulkActionFailure"
      required: [exported, integrationRef, exportedAt]

    BulkIdsInput:
      type: object
      properties:
        diariaIds:
          type: array
          items:
            type: integer
      required: [diariaIds]

    BulkRejectInput:
      type: object
      properties:
        diariaIds:
          type: array
          items:
            type: integer
        note:
          type: string
          minLength: 1
      required: [diariaIds, note]

    BulkActionFailure:
      type: object
      properties:
        id:
          type: integer
        reason:
          type: string
      required: [id, reason]

    BulkActionResult:
      type: object
      properties:
        succeeded:
          type: array
          items:
            type: integer
        failed:
          type: array
          items:
            $ref: "#/components/schemas/BulkActionFailure"
      required: [succeeded, failed]

    PaymentDateInput:
      type: object
      properties:
        paymentDate:
          type: string
          format: date
      required: [paymentDate]

    BulkSetPaymentDateInput:
      type: object
      properties:
        diariaIds:
          type: array
          items:
            type: integer
        paymentDate:
          type: string
          format: date
      required: [diariaIds, paymentDate]

    DiariaIdsResult:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
        total:
          type: integer
      required: [ids, total]

    DiariasAnaliseSummary:
      type: object
      properties:
        pendentesCount:
          type: integer
        pendentesValue:
          type: number
        aprovadasCount:
          type: integer
        aprovadasValue:
          type: number
        reprovadasCount:
          type: integer
        reprovadasValue:
          type: number
        exportadasCount:
          type: integer
        exportadasValue:
          type: number
      required:
        - pendentesCount
        - pendentesValue
        - aprovadasCount
        - aprovadasValue
        - reprovadasCount
        - reprovadasValue
        - exportadasCount
        - exportadasValue

    DiariasPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Diaria"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
      required: [data, total, page, pageSize, totalPages]

    # ── AUDIT ─────────────────────────────────────────────────────────
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        entityType:
          type: string
        entityId:
          type: integer
        action:
          type: string
        userId:
          type: ["integer", "null"]
        userName:
          type: ["string", "null"]
          description: Current name from the user record; not a historical snapshot.
        userNameAtAction:
          type: ["string", "null"]
          description: Authenticated user's name recorded when the action occurred. Null for system actions and legacy records without a snapshot; never inferred from the current user name.
        timestamp:
          type: string
          format: date-time
        oldValues:
          type: ["object", "null"]
          additionalProperties: true
        newValues:
          type: ["object", "null"]
          additionalProperties: true
        peopleConfirmation:
          description: Evidence recorded by a People reconciliation; null when not recorded.
          anyOf:
            - $ref: "#/components/schemas/PeopleConfirmation"
            - type: "null"
      required: [id, entityType, entityId, action, timestamp]

    PeopleConfirmation:
      type: object
      properties:
        confirmedByName:
          type: ["string", "null"]
          description: Responsible user's name recorded at confirmation time; null for legacy records without a snapshot. Never inferred from the current user record.
        externalId:
          type: ["string", "null"]
        verifiedCnpj:
          type: ["string", "null"]
        documentDescription:
          type: ["string", "null"]
        preservedProvider:
          anyOf:
            - $ref: "#/components/schemas/ConfirmationProvider"
            - type: "null"
        removedProvider:
          anyOf:
            - $ref: "#/components/schemas/ConfirmationProvider"
            - type: "null"
      required: [confirmedByName, externalId, verifiedCnpj, documentDescription, preservedProvider, removedProvider]

    ConfirmationProvider:
      type: object
      properties:
        id:
          type: integer
        name:
          type: ["string", "null"]
        decargoId:
          type: ["string", "null"]
      required: [id, name, decargoId]

    AuditPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
      required: [data, total, page, pageSize, totalPages]

    # ── DASHBOARD ─────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        pendentes:
          type: integer
        emAnalise:
          type: integer
        aprovadas:
          type: integer
        rejeitadas:
          type: integer
        disponivelExportacao:
          type: integer
        exportadas:
          type: integer
        pagas:
          type: integer
        canceladas:
          type: integer
        totalValorAprovadas:
          type: ["number", "null"]
        totalValorExportadas:
          type: ["number", "null"]
        totalValorPagas:
          type: ["number", "null"]
      required:
        - pendentes
        - emAnalise
        - aprovadas
        - rejeitadas
        - disponivelExportacao
        - exportadas
        - pagas
        - canceladas

    TeamMetrics:
      type: object
      properties:
        teamId:
          type: integer
        teamName:
          type: string
        total:
          type: integer
        pendentes:
          type: integer
        aprovadas:
          type: integer
        rejeitadas:
          type: integer
        exportadas:
          type: integer
        pagas:
          type: integer
        totalValor:
          type: ["number", "null"]
      required: [teamId, teamName, total, pendentes, aprovadas, rejeitadas, exportadas, pagas]

    ProviderMetrics:
      type: object
      properties:
        providerId:
          type: integer
        providerName:
          type: string
        teamName:
          type: string
        total:
          type: integer
        pendentes:
          type: integer
        aprovadas:
          type: integer
        exportadas:
          type: integer
        pagas:
          type: integer
        totalValor:
          type: ["number", "null"]
      required: [providerId, providerName, teamName, total, pendentes, aprovadas, exportadas, pagas]

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        diariaId:
          type: integer
        providerName:
          type: string
        teamName:
          type: string
        action:
          type: string
        userName:
          type: ["string", "null"]
          description: Current name from the user record; not a historical snapshot.
        userId:
          type: ["integer", "null"]
        userNameAtAction:
          type: ["string", "null"]
          description: Authenticated user's name recorded at action time; null when not recorded. Never inferred from the current user name.
        timestamp:
          type: string
          format: date-time
        status:
          type: string
      required: [id, diariaId, providerName, teamName, action, userName, timestamp, status]

    # ── REPORTS ───────────────────────────────────────────────────────
    DiariasReport:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Diaria"
        totalRecords:
          type: integer
        totalValor:
          type: ["number", "null"]
        byStatus:
          type: object
          additionalProperties:
            type: integer
        byTeam:
          type: array
          items:
            $ref: "#/components/schemas/TeamMetrics"
      required: [data, totalRecords, byStatus, byTeam]
